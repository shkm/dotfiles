[preview]
revision_command = ["show", "--color", "always", "-r", "$change_id", "--tool", "delta"]
file_command = ["diff", "--color", "always", "-r", "$change_id", "$file", "--tool", "delta"]

# Replaces the default jump to parent/children on these keys.
[[bindings]]
key = "shift+j"
action = "ui.preview_scroll_down"
scope = "revisions"
desc = "scroll preview down"

[[bindings]]
key = "shift+k"
action = "ui.preview_scroll_up"
scope = "revisions"
desc = "scroll preview up"
