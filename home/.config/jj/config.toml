#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Jamie Schembri"
email = "jamie@schembri.me"

[experimental-advance-branches]
enabled-branches = ["main"]

[signing]
backend = "ssh"
behavior = "own"
key = "~/.ssh/jamie-macbook.pub"

[git]
sign-on-push = true

